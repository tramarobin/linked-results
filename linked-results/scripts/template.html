<!doctype html>
<!-- Template of a linked results document. build_document.py replaces DATA (the rows, statistics,
     texts and methods) and the title, and removes these comments. JavaScript comments ship with the page. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9; --surface: #ffffff; --ink: #16191d; --ink-2: #454b54; --muted: #6b717a;
    --line: #c9cdd3; --grid: #e6e8eb; --rule: #16191d; --focus: #111418; --chip: #eceef1;
    --chip-on: #16191d; --chip-on-ink: #ffffff; --row: #eef1f5; --hl: #d7263d; --shade: rgba(0,0,0,.18);
    --sel-soft: #eaf1f9; --sel: #d6e3f2; --lift: #ffffff; --lift-sh: rgba(0, 35, 80, .28); --lift-sh2: rgba(0, 35, 80, .42);
    --pline: #a6a6a6; --cross: #3d3d3d; --link: #1f5fbf;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121417; --surface: #1b1e22; --ink: #e9ebee; --ink-2: #b9bec5; --muted: #8e959e;
      --line: #454b53; --grid: #2b2f35; --rule: #e9ebee; --focus: #ffffff; --chip: #262a30;
      --chip-on: #e9ebee; --chip-on-ink: #121417; --row: #262a30; --hl: #ff5a6e; --shade: rgba(0,0,0,.6);
      --sel-soft: #22303f; --sel: #2e4560; --lift: #2a3038; --lift-sh: rgba(0, 0, 0, .6); --lift-sh2: rgba(0, 0, 0, .85);
      --pline: #5a5f66; --cross: #c9cdd3; --link: #7fb0ff;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121417; --surface: #1b1e22; --ink: #e9ebee; --ink-2: #b9bec5; --muted: #8e959e;
    --line: #454b53; --grid: #2b2f35; --rule: #e9ebee; --focus: #ffffff; --chip: #262a30;
    --chip-on: #e9ebee; --chip-on-ink: #121417; --row: #262a30; --hl: #ff5a6e; --shade: rgba(0,0,0,.6);
    --sel-soft: #22303f; --sel: #2e4560; --lift: #2a3038; --lift-sh: rgba(0, 0, 0, .6); --lift-sh2: rgba(0, 0, 0, .85);
      --pline: #5a5f66; --cross: #c9cdd3; --link: #7fb0ff;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .top { position: sticky; top: 0; z-index: 20; display: flex; align-items: stretch; gap: 4px; min-height: 52px;
         padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; margin: 0 18px 0 0; padding: 8px 22px 8px 0; border-right: 1px solid var(--line);
           font-size: 16px; font-weight: 700; line-height: 1.25; max-width: 520px; }
  .top nav { display: flex; align-items: stretch; gap: 2px; }
  .tab { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13.5px; font-weight: 650;
         letter-spacing: .09em; text-transform: uppercase; padding: 0 16px; cursor: pointer;
         border-bottom: 3px solid transparent; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .tab:focus-visible { outline: 2px solid var(--focus); outline-offset: -4px; }
  .wrap { max-width: 1900px; margin: 0 auto; padding: 0 24px; }
  .sub { color: var(--ink-2); margin: 14px 0 2px; max-width: 1060px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 10px; }
  .controls .lab { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; min-width: 64px; }
  .chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink);
          border-radius: 999px; padding: 5px 13px; font: inherit; cursor: pointer; }
  .chip:hover { border-color: var(--ink-2); }
  .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; padding: 12px 0 24px; align-items: start; }
  main.methods aside { display: none; }
  .box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; }
  .box h2 { font-size: 15px; font-weight: 650; margin: 0 0 8px; }
  .prose { max-width: 1060px; }
  .prose h2 { font-size: 16px; margin: 14px 0 6px; }
  .prose h2:first-child { margin-top: 2px; }
  .prose p { margin: 0 0 9px; }
  .results p { margin: 0 0 8px; max-width: 1100px; }
  .results p:last-child { margin-bottom: 0; }
  /* a statistic of a text: linked to its table and figure */
  .ref { border-bottom: 1px dotted color-mix(in srgb, var(--link) 60%, transparent); border-radius: 3px; cursor: pointer;
          transition: background-color .12s; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .ref:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  /* the house style of a marked statistic: soft blue when hovered, deeper when kept (pinned) */
  .ref.hov { background: var(--sel-soft); box-shadow: 0 0 0 2px var(--sel-soft); }
  .ref.on, .ref.pinned { background: var(--sel); box-shadow: 0 0 0 2px var(--sel); }
  .tablebox { overflow-x: auto; }
  table.t { border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  table.t th, table.t td { padding: 4px 8px; white-space: nowrap; }
  table.t thead tr:first-child th { border-top: 2px solid var(--rule); font-weight: 650; }
  table.t thead tr:last-child th { border-bottom: 1.5px solid var(--rule); font-weight: 500; color: var(--ink-2); font-size: 12px; }
  table.t th { text-align: center; }
  table.t th:first-child, table.t td:first-child { text-align: left; }
  table.t td { text-align: center; }
  table.t td.u { color: var(--ink-2); }
  table.t tbody tr:last-child td { border-bottom: 2px solid var(--rule); }
  table.t tr.data { cursor: pointer; }
  table.t tr.data:hover td { background: var(--row); }
  table.t tr.data.cur td:first-child { box-shadow: inset 3px 0 0 var(--ink-2); }
  table.t td.k { cursor: pointer; }
  table.t td.hov { background: var(--sel-soft) !important; }
  table.t td.on, table.t td.pinned { background: var(--sel) !important; }
  table.t .b, table.s .b { font-weight: 700; }
  .key { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  .note { color: var(--muted); font-size: 12px; margin: 8px 0 0; max-width: 1100px; }
  /* a table wider than its box: an arrow each side on hover, a click scrolls it */
  .hscroll { position: relative; }
  .harrow { position: absolute; z-index: 4; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; padding: 0;
            display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line);
            background: var(--surface); color: var(--ink); box-shadow: 0 2px 8px var(--shade); cursor: pointer;
            opacity: 0; pointer-events: none; transition: opacity .15s; }
  .harrow.l { left: 6px; } .harrow.r { right: 6px; }
  .hscroll.canl:hover .harrow.l, .hscroll.canr:hover .harrow.r { opacity: .94; pointer-events: auto; }
  details.box > summary { cursor: pointer; font-weight: 650; font-size: 15px; }
  details.box[open] > summary { margin-bottom: 8px; }
  table.pp td, table.pp th { padding: 3px 8px; }
  table.pp td.g0, table.pp th.g0 { border-left: 1px solid var(--line); }
  table.pp td.sh, table.pp th.sh { background: color-mix(in srgb, var(--row) 70%, transparent); }
  table.pp tbody tr:hover td, table.pp tbody tr.hl td { background: var(--row); }
  table.pp tbody tr.hl td:first-child { color: var(--hl); font-weight: 700; }
  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px;
         padding: 4px 12px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .btn:hover { background: var(--chip); }
  /* the figure and statistics panel */
  aside { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .kicker { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  aside h3 { font-size: 16px; margin: 2px 0 6px; font-weight: 650; }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 6px; }
  .figwrap { position: relative; }
  .fig svg { display: block; width: 100%; height: auto; overflow: visible; }
  .fig text { font-family: inherit; }
  .fig .tick { fill: var(--ink-2); }
  .fig .ttl { fill: var(--ink); font-weight: 650; }
  .fig .cap { fill: var(--ink-2); }
  .fig .cap .b { font-weight: 700; fill: var(--ink); }
  .fig .grid { stroke: var(--grid); }
  .fig .zero { stroke: var(--muted); stroke-dasharray: 3 3; }
  .fig .axis { stroke: var(--line); }
  .fig .pl { fill: var(--ink); }
  .fig .pl.ns { fill: var(--muted); }
  .fig .br { fill: none; stroke: var(--ink); stroke-width: 1.2; }
  .fig .out { opacity: .42; }
  .fig .mean { stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; pointer-events: none; }
  .fig .sdc { fill: none; stroke-width: 3.2; stroke-linejoin: round; stroke-linecap: round; }
  .fig .mv { fill: var(--ink); stroke: var(--surface); pointer-events: none; }
  .fig .pline { fill: none; stroke: var(--pline); stroke-width: .8; }
  .fig .pline.hl { stroke: var(--ink); stroke-width: 2; }
  .fig .ind { stroke: var(--cross); stroke-width: 1.3; }
  .fig .ind.hl { stroke: var(--ink); stroke-width: 2.8; }
  .fig .ring { display: none; }
  .fig g.pt.hov .ind, .fig g.pt.on .ind { stroke: var(--ink); stroke-width: 2.6; }
  .fig .fit { fill: none; stroke: var(--ink); stroke-width: 2; }
  .fig .fit.ns { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .fig .stl { fill: var(--ink-2); }
  .fig .stl.b { fill: var(--ink); font-weight: 700; }
  .pblock { margin: 6px 0 14px; padding: 10px 0 2px; border-top: 1px solid var(--grid); border-bottom: 1px solid var(--grid); }
  .pblock h3 { font-size: 14px; margin: 0 0 6px; }
  .pblock .tablebox { margin-bottom: 8px; }
  .pblock table.t tr[data-k] { cursor: pointer; }
  .pblock table.t tr.hov td { background: var(--sel-soft); }
  .pblock table.t tr.on td, .pblock table.t tr.pinned td { background: var(--sel); }
  .pblock details > summary { cursor: pointer; font-weight: 600; margin: 6px 0; }
  /* a citation: its reference in a popover; the citation and its entry in the list mark each other */
  .cite { border-bottom: 1.5px dotted color-mix(in srgb, var(--link) 75%, transparent); border-radius: 3px; cursor: pointer;
          transition: background-color .12s; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .cite.chov, .refentry.chov { background: var(--sel-soft); box-shadow: 0 0 0 2px var(--sel-soft); }
  .cite.cpin { background: var(--sel); box-shadow: 0 0 0 2px var(--sel); }
  .refentry { border-radius: 3px; transition: background-color .12s; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .pop { position: absolute; z-index: 30; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
         border-radius: 8px; box-shadow: 0 10px 34px var(--shade); padding: 9px 12px 10px; font-size: 13px; line-height: 1.45; }
  .pop.pinned { border-color: color-mix(in srgb, var(--link) 60%, var(--line)); }
  .pop .x { float: right; margin: -4px -6px 0 8px; border: 0; background: none; color: var(--muted); font-size: 16px; cursor: pointer; }
  .fig .hit { fill: transparent; cursor: default; }
  .fig .pbg, .fig .vbg { fill: transparent; }
  /* a marked panel or violin is lifted: a card on a soft shadow, deeper when kept (pinned) */
  .fig .pbg.hov, .fig .vbg.hov { fill: var(--lift); filter: drop-shadow(0 1px 5px var(--lift-sh)); }
  .fig .pbg.on, .fig .vbg.on, .fig .pbg.pinned, .fig .vbg.pinned { fill: var(--lift); filter: drop-shadow(0 2px 9px var(--lift-sh2)); }
  .fig .sbg { fill: transparent; }
  .fig .brk.hov .br, .fig .brk.on .br { stroke-width: 2.4; }
  .fig .brk.hov .sbg { fill: var(--sel-soft); }
  .fig .brk.on .sbg { fill: var(--sel); }
  .tt { position: absolute; pointer-events: none; background: var(--surface); color: var(--ink);
        border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 12px; line-height: 1.4;
        box-shadow: 0 2px 10px var(--shade); white-space: normal; max-width: min(380px, 92%); display: none; z-index: 6; }
  .tt .m { color: var(--muted); }
  .grow { position: absolute; top: 0; right: 0; z-index: 3; width: 28px; height: 28px; padding: 0; border-radius: 6px;
          border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; opacity: .55;
          font-size: 15px; line-height: 1; }
  .grow:hover, .grow:focus-visible { opacity: 1; }
  .figkey { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  .stats h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; margin: 14px 0 4px; }
  table.s { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  table.s th, table.s td { padding: 3px 7px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  table.s th:first-child, table.s td:first-child { text-align: left; white-space: normal; }
  table.s thead th { color: var(--muted); font-weight: 500; font-size: 11.5px; }
  table.s tr[data-k] { cursor: pointer; }
  table.s tr[data-k]:hover td { background: var(--row); }
  table.s tr.hov td { background: var(--sel-soft) !important; }
  table.s tr.on td, table.s tr.pinned td { background: var(--sel) !important; }
  table.s tr.sub td { color: var(--ink-2); font-size: 12px; text-align: left; padding-top: 7px; border-bottom: 1px solid var(--line); }
  table.s tr.outr td { color: var(--muted); }
  .snote { color: var(--muted); font-size: 11.5px; margin: 4px 0 0; }
  .pbar { display: none; }
  @media (min-width: 1400px) {
    main:not(.methods) { grid-template-columns: minmax(0, 1fr) 560px; }
    aside { position: sticky; top: 64px; max-height: calc(100vh - 76px); overflow: auto; }
  }
  @media (max-width: 1399px) {
    aside { position: sticky; bottom: 0; max-height: 50vh; overflow: auto; box-shadow: 0 -4px 16px var(--shade); }
    .pbar { display: flex; align-items: center; gap: 10px; position: sticky; top: -12px; z-index: 5;
            margin: -12px -14px 8px; padding: 6px 10px 6px 14px; background: var(--surface);
            border-bottom: 1px solid var(--grid); border-radius: 8px 8px 0 0; }
    aside.collapsed { overflow: hidden; }
    aside.collapsed #panelBody { display: none; }
    aside.collapsed .pbar { margin-bottom: -12px; border-bottom: 0; border-radius: 8px; }
  }
  .ptitle { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  dialog.big { width: min(1200px, 94vw); max-height: 92vh; border: 1px solid var(--line); border-radius: 10px;
               background: var(--surface); color: var(--ink); padding: 12px 16px 16px; }
  dialog.big::backdrop { background: rgba(0, 0, 0, .45); }
  .dhead { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .dhead h3 { flex: 1; margin: 0; font-size: 16px; }
  footer { color: var(--muted); font-size: 12px; padding: 4px 0 28px; max-width: 1100px; }
  .stats { overflow-x: auto; }
  @media (max-width: 700px) {
    table.s th, table.s td { padding: 3px 4px; }
    table.s thead th { white-space: normal; }
    .wrap { padding: 0 16px; }
    .top { padding: 0 12px; flex-wrap: wrap; }
    .brand { border-right: 0; padding-right: 0; margin-right: 0; width: 100%; font-size: 15px; }
    .tab { padding: 10px 12px; }
  }
</style>
</head>
<body>
<header class="top">
  <h1 class="brand" id="brand"></h1>
  <nav role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="tabMethods" type="button">Methods</button>
    <button class="tab" role="tab" id="tabResults" type="button">Results</button>
  </nav>
</header>
<div class="wrap">
  <p class="sub" id="sub"></p>
  <div class="controls" id="groupbar" role="toolbar" aria-label="Results"><span class="lab">Results</span><span id="groups"></span></div>
  <div class="controls" id="tabbar" role="toolbar" aria-label="Variable"><span class="lab">Variable</span><span id="tabs"></span></div>
  <main id="main">
    <div id="content"></div>
    <aside id="panel" aria-label="Figure and statistics">
      <div class="pbar"><span class="ptitle" id="ptitle">Figure and statistics</span>
        <button class="btn" id="pToggle" type="button" aria-expanded="true" aria-controls="panelBody">Hide figure</button></div>
      <div id="panelBody" aria-live="polite"></div>
    </aside>
  </main>
  <footer id="foot"></footer>
</div>
<dialog class="big" id="big" aria-labelledby="bigTitle">
  <div class="dhead"><h3 id="bigTitle"></h3><button class="btn" id="bigClose" type="button">Close</button></div>
  <div id="bigBody"></div>
</dialog>

<script>
const DATA = /*DATA*/;
const NS = 'http://www.w3.org/2000/svg';
const $ = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const S = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; };
const html = (tag, cls, h) => { const e = $(tag, cls); e.innerHTML = h; return e; };
const MINUS = '−', TIMES = '×';
const ALPHA = DATA.alpha;

// ------------------------------------------------------------------ numbers (the texts are written the same way)
const isNum = v => v !== null && v !== undefined && isFinite(v);
function fx(v, d) {
  if (!isNum(v)) return '–';
  let s = v.toFixed(d);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('-', MINUS);
}
const sgn = (v, d) => { const s = fx(v, d); return !isNum(v) || s.startsWith(MINUS) || +s === 0 ? s : '+' + s; };
const pfmt = p => !isNum(p) ? '–' : p < 0.001 ? '<0.001' : p.toFixed(3);
const plab = p => p < 0.001 ? 'p < 0.001' : 'p = ' + p.toFixed(3);
const withUnit = (s, u) => !u ? s : u.startsWith('%') ? s + u : s + ' ' + u;

// ------------------------------------------------------------------ factors, levels and their colours
const FAC = {}; DATA.factors.forEach(f => { FAC[f.id] = f; f.lv = {}; f.levels.forEach(L => { f.lv[L.code] = L; }); });
const FIDS = DATA.factors.map(f => f.id);
const cvar = (fid, code) => '--c-' + (fid + '-' + code).replace(/[^A-Za-z0-9_-]/g, '_');
(() => {
  const light = [], dark = [];
  DATA.factors.forEach(f => f.levels.forEach(L => { light.push(cvar(f.id, L.code) + ':' + L.color); dark.push(cvar(f.id, L.code) + ':' + L.color_dark); }));
  const st = document.createElement('style');
  st.textContent = `:root{${light.join(';')}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${dark.join(';')}}}:root[data-theme="dark"]{${dark.join(';')}}`;
  document.head.append(st);
})();
const col = (fid, code) => `var(${cvar(fid, code)})`;
const DESIGN = (DATA.factors.length === 2 ? 'two-way ' : 'one-way ') +
  (DATA.factors.every(f => f.within) ? 'repeated-measures ' : DATA.factors.some(f => f.within) ? 'mixed ' : '') + 'analysis of variance';
const termName = t => t.split(':').map(x => FAC[x].name).join(' ' + TIMES + ' ');
const cellName = (lv, sep) => FIDS.map(f => FAC[f].lv[lv[f]].name).join(sep || ' · ');
const cellShort = lv => FIDS.map(f => FAC[f].lv[lv[f]].short).join(' · ');
const ROWS = DATA.rows;
const rowLabel = (R, multi) => multi ? R.name + (R.splitName ? ' · ' + R.splitName : '') : (R.splitName || R.name);

// ------------------------------------------------------------------ linking: one key per statistic, marked everywhere
// keys of a row: t:<term> (ANOVA), m:... and x:... (comparisons: a main effect, or inside an interaction),
// cell:<code> (a condition), lv:<factor>=<level> (a level over the other factor)
const compOf = (R, k) => (R.comps || []).find(c => c.key === k);
function owner(R, k) { if (!R || !k) return null; const c = compOf(R, k); return c ? 't:' + c.term : null; }
const related = (R, a, b) => a === b || owner(R, a) === b || owner(R, b) === a;
let hov = null, pin = null, curRow = null;
function paint() {
  document.querySelectorAll('.hov, .on, .pinned').forEach(e => e.classList.remove('hov', 'on', 'pinned'));
  const mark = (st, cls) => {
    if (!st) return;
    const R = ROWS[st.row];
    document.querySelectorAll('[data-k]').forEach(e => { if (e.dataset.row === st.row && related(R, st.key, e.dataset.k)) e.classList.add(cls); });
    document.querySelectorAll('[data-ks]').forEach(e => { if (e.dataset.row === st.row && e.dataset.ks.split(' ').includes(st.key)) e.classList.add(cls); });
  };
  mark(pin, 'on');

// ------------------------------------------------------------------ citations: the reference in a popover
// Hover a citation: after 150 ms its reference opens under it (over it when there is no room), with its link;
// leaving closes it after 250 ms, so the pointer can reach the link. A click keeps it open; Esc, the x, a second
// click or a click elsewhere closes it. A citation and its entry in the references mark each other.
const REFS = DATA.refs || {};
const pop = $('div', 'pop'); pop.hidden = true; pop.setAttribute('role', 'dialog'); document.body.append(pop);
let popFor = null, popPinned = false, popT = null;
const markRef = (key, on) => document.querySelectorAll(`.cite[data-cite="${key}"], .refentry[data-ref="${key}"]`)
  .forEach(e => e.classList.toggle('chov', on));
function openPop(el, pinned) {
  const key = el.dataset.cite, ref = REFS[key];
  if (!ref) return;

  popFor = el; popPinned = !!pinned;

  pop.classList.toggle('pinned', popPinned);

  const x = $('button', 'x', '×'); x.type = 'button'; x.setAttribute('aria-label', 'Close'); x.addEventListener('click', closePop);
  pop.prepend(x);
  pop.hidden = false;
  const docW = document.documentElement.clientWidth, pw = Math.min(460, docW - 24);
  pop.style.width = pw + 'px';
  // under the line of the citation the pointer is on (a citation may wrap over two lines)
  const rects = [...el.getClientRects()], r = rects[0] || el.getBoundingClientRect();
  const left = Math.max(12, Math.min(r.left + r.width / 2 - pw / 2, docW - pw - 12));
  const below = r.bottom + 6, h = pop.offsetHeight;
  const top = below + h + 8 > window.innerHeight && r.top - h - 6 > 0 ? r.top - h - 6 : below;
  pop.style.left = (left + window.scrollX) + 'px';
  pop.style.top = (top + window.scrollY) + 'px';
}
function closePop() {

}
document.addEventListener('pointerover', e => {

  if (e.target.closest && e.target.closest('.pop')) { clearTimeout(popT); return; }
  const r = e.target.closest && e.target.closest('.refentry');
  document.querySelectorAll('.refentry.chov, .cite.chov').forEach(x => { if (!popFor || x.dataset.cite !== popFor.dataset.cite && x.dataset.ref !== popFor.dataset.cite) x.classList.remove('chov'); });
  if (r) markRef(r.dataset.ref, true);

  tb.append($('p', 'note', corr ? corrNote(R0) : `Mean (SD) of the ${R0.n} participants. p: ${DESIGN}` +
    (DATA.nPerm ? `, exact p-values from all ${DATA.nPerm.toLocaleString('en')} sign-flip permutations` : '') +
    `; bold: p ≤ ${ALPHA}. Hover a row, a value or a p-value to see its figure and statistics; click to keep them.`));
  content.append(tb);
  const det = $('details', 'box');
  det.append($('summary', null, 'Values per participant'));
  const ps = $('div', 'tablebox'); ps.append(corr ? corrPeopleTable(tab) : peopleTable(tab)); det.append(hscroll(ps));
  const dl = $('button', 'btn', 'Download these values (CSV)'); dl.type = 'button'; dl.style.marginTop = '8px';
  dl.addEventListener('click', () => download(tab.label.replace(/[\\/:*?"<>|]/g, '') + '.csv', corr ? corrCsv(tab) : csvOf(tab)));
  det.append(dl);
  content.append(det);
  showRow(tab.rows[0]);
  paint();
  save();
}
document.getElementById('tabMethods').addEventListener('click', () => { nav.top = 'methods'; render(); });
document.getElementById('tabResults').addEventListener('click', () => { nav.top = 'results'; render(); });
document.getElementById('brand').textContent = DATA.title;
document.getElementById('sub').textContent = DATA.subtitle;
document.getElementById('foot').innerHTML = DATA.footer;
render();
</script>
</body>
</html>
