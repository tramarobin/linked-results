<script>
const DATA = {"title":"Muscle vibrations: accelerometry and ultrafast ultrasonography","subtitle":"Vastus lateralis vibrations after an impact, measured with a skin-mounted accelerometer and with ultrafast ultrasonography in a relaxed and a contracted muscle (15 participants). Every result of the extracted variables, with each participant's values.","footer":"Data and methods: Trama R, Hautier CA, Souron R, Lapole T, Fouré A, Blache Y (2021). Is accelerometry an effective method to assess muscle vibrations in comparison to ultrafast ultrasonography? <i>IEEE Transactions on Biomedical Engineering<\/i>, <a href=\"https://doi.org/10.1109/TBME.2020.3035838\">doi:10.1109/TBME.2020.3035838<\/a>. Document built with <a href=\"https://github.com/tramarobin/linked-results\">linked-results<\/a>.","alpha":0.05,"nPerm":16384.0,"people":["P1","P2","P3","P4","P5","P6","P7","P8","P9","P10","P11","P12","P13","P14","P15"],"factors":[{"id":"Device","name":"Device","noun":"device","plural":"devices","within":true,"ref":"Echo","levels":[{"code":"Echo","name":"Ultrasonography","short":"US","color":"#2a78d6","color_dark":"#3987e5"},{"code":"ACC","name":"Accelerometry","short":"ACC","color":"#eb6834","color_dark":"#d95926"}]},{"id":"Activation","name":"Activation","noun":"activation level","plural":"activation levels","within":true,"ref":"R","levels":[{"code":"R","name":"Relaxed","short":"Relaxed","color":"#1baf7a","color_dark":"#199e70"},{"code":"C","name":"Contracted","short":"Contracted","color":"#6250d6","color_dark":"#9085e9"}]}],"terms":["Device","Activation","Device:Activation"],"split":"Axis","groups":[{"label":"Vibrations","tabs":[{"label":"Peak acceleration","rows":["peak_acceleration|L","peak_acceleration|V"],"text":["<b>Lateral (mediolateral) axis.<\/b> The peak acceleration was lower with accelerometry than with ultrasonography (<span class=\"ref\" data-row=\"peak_acceleration|L\" data-k=\"m:Device:ACC~Echo\">−9.8 m·s⁻², −29.4%, p = 0.010<\/span>) and higher in the contracted muscle than in the relaxed muscle (<span class=\"ref\" data-row=\"peak_acceleration|L\" data-k=\"m:Activation:C~R\">+14.7 m·s⁻², +69.6%, p &lt; 0.001<\/span>), with no interaction between the device and the activation level (<span class=\"ref\" data-row=\"peak_acceleration|L\" data-k=\"t:Device:Activation\">p = 0.850<\/span>).","<b>Vertical (anteroposterior) axis.<\/b> The peak acceleration was higher with accelerometry than with ultrasonography (<span class=\"ref\" data-row=\"peak_acceleration|V\" data-k=\"m:Device:ACC~Echo\">+32.0 m·s⁻², +113.4%, p &lt; 0.001<\/span>) and higher in the contracted muscle than in the relaxed muscle (<span class=\"ref\" data-row=\"peak_acceleration|V\" data-k=\"m:Activation:C~R\">+26.0 m·s⁻², +83.4%, p &lt; 0.001<\/span>), with no interaction between the device and the activation level (<span class=\"ref\" data-row=\"peak_acceleration|V\" data-k=\"t:Device:Activation\">p = 0.267<\/span>)."],"multi":false},{"label":"Main frequency","rows":["main_frequency|L","main_frequency|V"],"text":["<b>Lateral (mediolateral) axis.<\/b> The device effect depended on the activation level (<span class=\"ref\" data-row=\"main_frequency|L\" data-k=\"t:Device:Activation\">Device × Activation, p &lt; 0.001<\/span>). The main frequency was lower with accelerometry than with ultrasonography, more in the contracted muscle (<span class=\"ref\" data-row=\"main_frequency|L\" data-k=\"x:Device@Activation=C:ACC~Echo\">−26.9 Hz, −48.9%, p &lt; 0.001<\/span>) than in the relaxed muscle (<span class=\"ref\" data-row=\"main_frequency|L\" data-k=\"x:Device@Activation=R:ACC~Echo\">−10.0 Hz, −34.8%, p = 0.003<\/span>). It was higher in the contracted muscle than in the relaxed muscle, more with ultrasonography (<span class=\"ref\" data-row=\"main_frequency|L\" data-k=\"x:Activation@Device=Echo:C~R\">+26.3 Hz, +91.3%, p &lt; 0.001<\/span>) than with accelerometry (<span class=\"ref\" data-row=\"main_frequency|L\" data-k=\"x:Activation@Device=ACC:C~R\">+9.4 Hz, +49.8%, p = 0.005<\/span>).","<b>Vertical (anteroposterior) axis.<\/b> The device effect depended on the activation level (<span class=\"ref\" data-row=\"main_frequency|V\" data-k=\"t:Device:Activation\">Device × Activation, p = 0.040<\/span>). The main frequency was lower with accelerometry than with ultrasonography in the contracted muscle (<span class=\"ref\" data-row=\"main_frequency|V\" data-k=\"x:Device@Activation=C:ACC~Echo\">−9.9 Hz, −18.1%, p = 0.014<\/span>), but did not differ in the relaxed muscle (<span class=\"ref\" data-row=\"main_frequency|V\" data-k=\"x:Device@Activation=R:ACC~Echo\">−4.6 Hz, −12.9%, p = 0.068<\/span>). It was higher in the contracted muscle than in the relaxed muscle, more with ultrasonography (<span class=\"ref\" data-row=\"main_frequency|V\" data-k=\"x:Activation@Device=Echo:C~R\">+19.3 Hz, +54.3%, p &lt; 0.001<\/span>) than with accelerometry (<span class=\"ref\" data-row=\"main_frequency|V\" data-k=\"x:Activation@Device=ACC:C~R\">+14.0 Hz, +45.1%, p &lt; 0.001<\/span>)."],"multi":false},{"label":"Median frequency","rows":["median_frequency|L","median_frequency|V"],"text":["<b>Lateral (mediolateral) axis.<\/b> The device effect depended on the activation level (<span class=\"ref\" data-row=\"median_frequency|L\" data-k=\"t:Device:Activation\">Device × Activation, p &lt; 0.001<\/span>). The median frequency was lower with accelerometry than with ultrasonography, more in the contracted muscle (<span class=\"ref\" data-row=\"median_frequency|L\" data-k=\"x:Device@Activation=C:ACC~Echo\">−16.9 Hz, −27.4%, p &lt; 0.001<\/span>) than in the relaxed muscle (<span class=\"ref\" data-row=\"median_frequency|L\" data-k=\"x:Device@Activation=R:ACC~Echo\">−6.9 Hz, −16.1%, p = 0.013<\/span>). It was higher in the contracted muscle than in the relaxed muscle, more with ultrasonography (<span class=\"ref\" data-row=\"median_frequency|L\" data-k=\"x:Activation@Device=Echo:C~R\">+18.8 Hz, +44.0%, p &lt; 0.001<\/span>) than with accelerometry (<span class=\"ref\" data-row=\"median_frequency|L\" data-k=\"x:Activation@Device=ACC:C~R\">+8.8 Hz, +24.6%, p &lt; 0.001<\/span>).","<b>Vertical (anteroposterior) axis.<\/b> The median frequency was lower with accelerometry than with ultrasonography (<span class=\"ref\" data-row=\"median_frequency|V\" data-k=\"m:Device:ACC~Echo\">−8.0 Hz, −14.0%, p &lt; 0.001<\/span>) and higher in the contracted muscle than in the relaxed muscle (<span class=\"ref\" data-row=\"median_frequency|V\" data-k=\"m:Activation:C~R\">+13.6 Hz, +29.5%, p &lt; 0.001<\/span>), with no interaction between the device and the activation level (<span class=\"ref\" data-row=\"median_frequency|V\" data-k=\"t:Device:Activation\">p = 0.523<\/span>)."],"multi":false},{"label":"Damping","rows":["damping|L","damping|V"],"text":["<b>Lateral (mediolateral) axis.<\/b> Damping was lower with accelerometry than with ultrasonography (<span class=\"ref\" data-row=\"damping|L\" data-k=\"m:Device:ACC~Echo\">−12.4 s⁻¹, −37.4%, p &lt; 0.001<\/span>) and higher in the contracted muscle than in the relaxed muscle (<span class=\"ref\" data-row=\"damping|L\" data-k=\"m:Activation:C~R\">+13.4 s⁻¹, +65.6%, p &lt; 0.001<\/span>), with no interaction between the device and the activation level (<span class=\"ref\" data-row=\"damping|L\" data-k=\"t:Device:Activation\">p = 0.255<\/span>).","<b>Vertical (anteroposterior) axis.<\/b> Damping was lower with accelerometry than with ultrasonography (<span class=\"ref\" data-row=\"damping|V\" data-k=\"m:Device:ACC~Echo\">−5.7 s⁻¹, −15.1%, p = 0.007<\/span>) and higher in the contracted muscle than in the relaxed muscle (<span class=\"ref\" data-row=\"damping|V\" data-k=\"m:Activation:C~R\">+4.7 s⁻¹, +14.5%, p = 0.014<\/span>), with no interaction between the device and the activation level (<span class=\"ref\" data-row=\"damping|V\" data-k=\"t:Device:Activation\">p = 0.465<\/span>)."],"multi":false},{"label":"Correlation with fat thickness","rows":["c:peak_acceleration|L","c:peak_acceleration|V","c:main_frequency|L","c:main_frequency|V","c:median_frequency|L","c:median_frequency|V","c:damping|L","c:damping|V"],"text":["<b>Lateral (mediolateral) axis.<\/b> The relative difference between accelerometry and ultrasonography did not correlate significantly with the fat thickness for any variable (smallest <span class=\"ref\" data-row=\"c:peak_acceleration|L\" data-k=\"r:Activation=C\">p = 0.544<\/span>).","<b>Vertical (anteroposterior) axis.<\/b> The relative difference between accelerometry and ultrasonography decreased with the fat thickness for the main frequency in the contracted muscle (<span class=\"ref\" data-row=\"c:main_frequency|V\" data-k=\"r:Activation=C\">r = −0.77, strong, −3.44% per mm, p = 0.005<\/span>), the median frequency in the relaxed muscle (<span class=\"ref\" data-row=\"c:median_frequency|V\" data-k=\"r:Activation=R\">r = −0.83, very strong, −2.32% per mm, p = 0.001<\/span>), the median frequency in the contracted muscle (<span class=\"ref\" data-row=\"c:median_frequency|V\" data-k=\"r:Activation=C\">r = −0.68, strong, −1.73% per mm, p = 0.029<\/span>) and damping in the relaxed muscle (<span class=\"ref\" data-row=\"c:damping|V\" data-k=\"r:Activation=R\">r = −0.79, strong, −3.41% per mm, p = 0.003<\/span>). The other 4 correlations were not significant (<span class=\"ref\" data-row=\"c:main_frequency|V\" data-k=\"r:Activation=R\">p ≥ 0.192<\/span>)."],"multi":true,"kind":"corr"}]},{"label":"EMG","tabs":[{"label":"Activation","rows":["emg"],"text":["The activation was higher in the contracted muscle than in the relaxed muscle (<span class=\"ref\" data-row=\"emg\" data-k=\"m:Activation:C~R\">+37.1% of maximal, p &lt; 0.001<\/span>); it did not differ between devices (<span class=\"ref\" data-row=\"emg\" data-k=\"t:Device\">p = 0.687<\/span>), with no interaction between the device and the activation level (<span class=\"ref\" data-row=\"emg\" data-k=\"t:Device:Activation\">p = 0.994<\/span>)."],"multi":false}]}],"rows":{"peak_acceler hen accelerometry gives the lower value","yUnit":"%","yDec":1,"entries":[{"key":"r:Activation=R","level":"R","r":0.2380302543,"p":1.0,"pRaw":0.3929455233,"slope":1.056427234,"intercept":-49.45110119,"n":15,"sig":false,"strength":"","y":[-39.76525261568296,-32.431623018158575,-59.53579101024199,-56.50022827435185,-0.9976127012290954,0.13965458091748034,-39.145927066301525,-19.090583427759462,-52.82400971544645,-55.25158273212803,-45.87092202844245,-23.585799197661117,-54.21270718560906,-47.26022752837664,-50.63125750362203]},{"key":"r:Activation=C","level":"C","r":-0.1908325106,"p":1.0,"pRaw":0.4956975276,"slope":-0.6672282688,"intercept":-26.45722,"n":15,"sig":false,"strength":"","y":[-54.12442152388087,-25.2614374321892,-39.37886374763673,-36.46924551299352,-34.152330449384095,-27.385863469548127,-30.937094564737315,-39.10848746464854,-47.0777794223217,-42.27530671328205,-48.91521136699925,-45.71232140935428,-25.21273137915267,2.190803187176848,-7.125618667104347]}],"n":15},"c:damping|V":{"id":"c:damping|V","kind":"corr","outcome":"damping","name":"Damping","noun":"damping","split":"V","splitName":"Vertical","splitLong":"Vertical (anteroposterior) axis","by":"Activation","x":"fat_thickness","yNoun":"the relative difference between accelerometry and ultrasonography","yLabel":"Relative difference","yFormula":"100 × (accelerometry − ultrasonography) / ultrasonography","yNeg":"negative when accelerometry gives the lower value","yUnit":"%","yDec":1,"entries":[{"key":"r:Activation=R","level":"R","r":-0.7920855125,"p":0.003020761456,"pRaw":0.0004315373509,"slope":-3.412089323,"intercept":23.94410729,"n":15,"sig":true,"strength":"strong","y":[-36.43292976651991,-4.329903216463536,-2.3506837618792296,3.706872065060811,-45.78224031445234,25.315249942210894,-4.0189174536214445,-6.612238082709292,-7.070924031726617,3.362258942909085,-27.044894709857857,-35.37993909805607,-1.6892330198188934,-7.645326690162737,-27.151475940923923]},{"key":"r:Activation=C","level":"C","r":0.05550251304,"p":1.0,"pRaw":0.8442488402,"slope":0.4066548291,"intercept":-16.72801859,"n":15,"sig":false,"strength":"","y":[-25.990348170037077,55.72466119869188,-55.24820232597958,-9.009247381523512,-31.36041423905712,-34.05169195169877,-51.9918273867186,-24.516531509909306,4.632976445934763,-12.120535502176086,-1.4020910600244185,49.85547484700989,-40.914000753913356,0.5785306718155787,-11.6688783393408]}],"n":15}},"methods":[{"h":"About this document","p":["This document gives every result of the variables extracted from the vibration signals, their correlations with the subcutaneous fat thickness and the muscle activation check, with each participant's values, from <span class=\"cite\" data-cite=\"trama2021\" tabindex=\"0\">Trama et al. (2021)<\/span>. The methods are the article's. The statistics differ slightly: each participant's mean values were compared with a permutation analysis of variance (see Statistics), where the article fitted linear mixed models to every trial, and the correlations include the peak acceleration. The power-map analysis (statistical parametric mapping) is reported in the article only."]},{"h":"Participants","p":["A group of 15 participants composed of <span class=\"ref\" data-row=\"participants\" data-k=\"pc:sex=M\">12<\/span> men and <span class=\"ref\" data-row=\"participants\" data-k=\"pc:sex=F\">3<\/span> women (<span class=\"ref\" data-row=\"participants\" data-k=\"pv:age\">25.1 ± 4.4<\/span> years, <span class=\"ref\" data-row=\"participants\" data-k=\"pv:height\">176 ± 6<\/span> cm, <span class=\"ref\" data-row=\"participants\" data-k=\"pv:mass\">70.7 ± 9.8<\/span> kg) volunteered to participate in this study. All the participants were healthy and free from lower-limb injury. The study was approved by the local university ethics committee, according to the statement of ethical principles of the Declaration of Helsinki, and the participants signed an informed consent document."]},{"h":"Instrumentation","p":["An electromyogram (EMG) of the vastus lateralis of the right leg was recorded at 1000 Hz with pairs of surface electrodes (Delsys, Natick, Massachusetts, USA). An Aixplorer ultrasound device was used with an SL15-4 probe (Supersonic Imagine, Aix-en-Provence, France) to obtain video of the vastus lateralis vibrations (1000 Hz). The soft tissue acceleration of the thigh as well as the probe acceleration (±50 g, 1000 Hz) were recorded with two biaxial accelerometers (Mega Electronics, Kuopio, Finland)."]},{"h":"Procedure and data collection","p":["Participants were seated on a custom-built isometric knee-extensor ergometer, with the hip and knee angles set at 90° and the chest secured with a safety belt. After having shaved and cleaned the skin with alcohol, surface electromyographic electrodes were placed on the vastus lateralis belly, according to SENIAM recommendations. Before the experiment, participants performed a standardized warm-up consisting of ten incremental isometric knee extensions of 5 seconds. After a 3-minute rest period, participants performed two maximum voluntary isometric contractions to determine the maximal EMG signal and normalize the vastus lateralis activation level.","Testing consisted of an assessment of vastus lateralis accelerations induced by an external shock, using a pendulum impactor (a reflex hammer dropped from an angle of 45° with respect to the vertical). The position of the impactor was adjusted so that the impact was administered 6 cm distally from the location of the muscle-vibration measurement device. Shocks were administered under a relaxed condition (4 shocks) and a contracted condition (4 shocks at 40% of the maximal activation). Visual feedback of the 0.05-second normalized root-mean-square EMG of the vastus lateralis was displayed on a computer screen to help the participant achieve the 40% ± 10% target activation level. The impact was administered when the activation level was reached.","For each condition, two-dimensional vastus lateralis vibrations were measured with both an ultrasound device and an accelerometer. The ultrasound probe was positioned perpendicularly to the longitudinal axis of the thigh and proximally to the EMG electrodes, so that the muscle vibrations were analysed along the mediolateral and anteroposterior axes of the thigh. The participant being seated, this document calls them the <b>lateral<\/b> (mediolateral) and <b>vertical<\/b> (anteroposterior) axes. The position of the probe was marked on the skin, and the probe was clamped with a mechanical arm. A water-based gel was applied between the skin and the probe to avoid probe-skin contact. The position of the probe was adjusted between the relaxed and contracted conditions to keep the probe out of contact with the skin when the muscle expanded, and therefore avoid any pressure from the probe on the skin. Once all the shocks were administered, the probe was replaced by the accelerometer, which was placed at the same location and oriented in the same direction as the probe. Thereafter, the same procedure was performed. Finally, the subcutaneous thigh fat thickness was measured with a skin caliper (the average of three measurements) at the location of the ultrasound probe and the accelerometer (<span class=\"ref\" data-row=\"participants\" data-k=\"pv:fat_thickness\">10.4 ± 4.4<\/span> mm, from <span class=\"ref\" data-row=\"participants\" data-k=\"pv:fat_thickness\">4.3–19.0<\/span> mm)."]},{"h":"Data treatment","p":["The data were processed with MATLAB R2018b (MathWorks, Natick, Massachusetts, USA). Raw EMG signals of the vastus lateralis were run through a Butterworth band-pass filter between 10 Hz and 499 Hz. Thereafter, the root-mean-square envelope of the signal was calculated with a window length of 0.05 seconds. The signals were normalized for each participant with the mean value of the greatest 0.5-second plateau obtained during the two maximal contractions. The mean EMG was calculated from 0.5 seconds to 0.05 seconds before the impact, to avoid the noise caused by the shock.","Vastus lateralis accelerations were first computed from the ultrasonographic images (bandwidth 7.5 MHz, acquisition frequency 1000 Hz, resolution 256 × 180 pixels, field of view 5 × 2.5 cm). The upper zone of the muscle, just below the subcutaneous fat, was manually selected, and the binary robust invariant scalable keypoints (BRISK) algorithm detected a maximum of 300 points within it. The point trajectories were tracked over time to obtain the mediolateral and anteroposterior displacements of each point. A Butterworth band-pass filter between 10 Hz and 130 Hz was applied to the displacements, which were then derived twice to obtain the point accelerations in the two directions. Points with a maximum acceleration above 5 m·s⁻² were included, and the mean acceleration of these points was analysed. The acceleration signals of the accelerometers (skin and probe) were filtered with a Butterworth band-pass filter between 10 Hz and 130 Hz.","The acceleration signals were investigated in the time-frequency domain with a continuous wavelet transform, using a Morse mother wavelet with γ = 3 and P² = 60. The modulus of the coefficients was expressed as power as a function of time and frequency, <i>p<\/i>(<i>t<\/i>, <i>f<\/i>), between 10 Hz and 130 Hz during the 0.25 seconds after the impact. The <b>main frequency<\/b> was the frequency with the most energy in the energy spectrum <i>E<\/i>(<i>f<\/i>), the integral of the power over time, and the <b>median frequency<\/b> the frequency that split that spectrum into two equal parts. The <b>damping<\/b> coefficient <i>D<\/i> was obtained by fitting the theoretical power decay <i>P<\/i><sub>T1<\/sub>·e<sup>−<i>D<\/i>·<i>t<\/i><\/sup> to the overall power <i>P<\/i>(<i>t<\/i>), the integral of the power over frequency, from the instant of maximal power decay (T1) to the instant when the power reached 10% of its value at T1. The <b>peak acceleration<\/b> was the largest acceleration of the filtered signal after the impact.","Trials for which the peak acceleration of the ultrasound probe was above 5 m·s⁻² on at least one axis were excluded. Each variable is each participant's mean over their retained trials (up to four per condition)."]},{"h":"Statistics","p":["Each variable was compared, separately on each axis, with a two-way repeated-measures analysis of variance: device (accelerometry, ultrasonography) × activation level (relaxed, contracted). The mean EMG does not depend on the axis and was analysed once. The p-values came from permutations: the residuals of the model without the tested effect were sign-flipped participant by participant (<span class=\"cite\" data-cite=\"freedman1983\" tabindex=\"0\">Freedman & Lane, 1983<\/span>; <span class=\"cite\" data-cite=\"winkler2014\" tabindex=\"0\">Winkler et al., 2014<\/span>). With 15 participants there are 16,384 distinct sign patterns, and every one of them was used, so each p-value is exact; the smallest possible is 1/16,384 = 0.000061.","When the interaction was significant, the two devices were compared within each activation level, and the two activation levels within each device, with paired t statistics on the same sign flips. These four comparisons were corrected together (single-step minimum p). Without a significant interaction, the same comparisons are shown pale: they are outside the interaction and mostly reflect the main effects. Effect sizes are Hedges' g. A result was significant when p ≤ 0.05.","For each vibration variable, axis and activation level, the relative difference between the devices, 100 × (accelerometry − ultrasonography) / ultrasonography, was computed for each participant and correlated with the subcutaneous fat thickness (Pearson's r, with the least-squares slope). The 8 p-values of each axis (t test of r) were corrected together with the Holm–Bonferroni method, the axes being analysed separately as in the analyses of variance. A significant correlation was called strong when |r| was between 0.6 and 0.79, and very strong when |r| ≥ 0.8.","The article analysed the same variables with linear mixed models on every trial (likelihood-ratio tests, Holm–Bonferroni correction, Tukey post hoc tests), and tested 12 correlations (the peak acceleration aside), whose figure gives uncorrected p-values. Its p-values and effect sizes can therefore differ slightly from these."]},{"h":"How to read this document","p":["Every statistic in a text, a table or a figure is linked. Linked statistics in the texts have a dotted underline. <b>Hover<\/b> one, or a table row or cell, and the same result is marked everywhere: in the text, in the table and in the figure beside it, which shows that row. <b>Click<\/b> it to keep it shown while you move to the figure; click it again, press <b>Esc<\/b> or click anywhere else to release it. Hovering a panel or a violin of the figure marks its statistics in the same way.","<b>Bold means significant<\/b> (p ≤ 0.05), and only that, in the tables and the figures.","Each figure shows every participant as a cross, at their own value, spread sideways only to avoid overlap. A grey line joins each participant's values across the levels of a within-participant factor. Hover a cross to see the participant and follow them across the panels. Each violin is the distribution of its group (a kernel density), its outline bold over the mean ± SD, the black line its mean, with the mean and (SD) written on it. The ⤢ button enlarges the figure.","The first row of the figure shows the main effects: each participant's mean over the other factor's levels. The next rows read the Device × Activation interaction one factor at a time: devices within each activation level, then activation levels within each device. Their comparisons are drawn solid where the interaction is significant (inside the interaction). Where it is not, they are drawn pale and greyed in the tables: outside the interaction, they mostly reflect the main effects and are not interaction effects.","Differences are accelerometry − ultrasonography for device and contracted − relaxed for activation level, computed from the group means. Relative differences divide them by the mean of the second level (the reference). Effect sizes are Hedges' g, signed like the difference.","The correlations relate each participant's difference to their characteristic: one scatter plot per test, every participant as a cross, the least-squares line (solid when the correlation is significant, dashed otherwise), with r, the slope and p. Their p-values are corrected together, as the methods say.","The participants' characteristics are in the methods (Participants), with a figure. Hovering a participant anywhere in the document shows their characteristics.","Citations (author, year) have a dotted underline: hover one to read its reference, with its link; click it to keep it open. Its entry in the references is marked at the same time.","Each participant's values are under <b>Values per participant<\/b>, below each table, and can be downloaded as a CSV file."]},{"h":"References","p":["<span class=\"refentry\" data-ref=\"freedman1983\">Freedman D, Lane D (1983). A nonstochastic interpretation of reported significance levels. <i>Journal of Business &amp; Economic Statistics<\/i>, 1, 292–298. <a href=\"https://doi.org/10.1080/07350015.1983.10509354\" target=\"_blank\" rel=\"noopener noreferrer\">doi:10.1080/07350015.1983.10509354<\/a><\/span>","<span class=\"refentry\" data-ref=\"trama2021\">Trama R, Hautier CA, Souron R, Lapole T, Fouré A, Blache Y (2021). Is accelerometry an effective method to assess muscle vibrations in comparison to ultrafast ultrasonography? <i>IEEE Transactions on Biomedical Engineering<\/i>. <a href=\"https://doi.org/10.1109/TBME.2020.3035838\" target=\"_blank\" rel=\"noopener noreferrer\">doi:10.1109/TBME.2020.3035838<\/a><\/span>","<span class=\"refentry\" data-ref=\"winkler2014\">Winkler AM, Ridgway GR, Webster MA, Smith SM, Nichols TE (2014). Permutation inference for the general linear model. <i>NeuroImage<\/i>, 92, 381–397. <a href=\"https://doi.org/10.1016/j.neuroimage.2014.01.060\" target=\"_blank\" rel=\"noopener noreferrer\">doi:10.1016/j.neuroimage.2014.01.060<\/a><\/span>"]}],"people_info":{"section":"Participants","vars":[{"id":"age","key":"pv:age","name":"Age","noun":"the age","unit":"years","dec":1,"vdec":0,"values":[25.0,22.0,22.0,28.0,23.0,22.0,34.0,21.0,21.0,29.0,23.0,26.0,22.0,24.0,34.0],"n":15,"mean":25.066666666666666,"sd":4.350150517374028,"min":21.0,"max":34.0},{"id":"height","key":"pv:height","name":"Height","noun":"the height","unit":"cm","dec":0,"vdec":0,"values":[175.0,178.0,178.0,182.0,171.0,179.0,177.0,180.0,175.0,175.0,162.0,167.0,181.0,176.0,188.0],"n":15,"mean":176.26666666666668,"sd":6.227435457790983,"min":162.0,"max":188.0},{"id":"mass","key":"pv:mass","name":"Body mass","noun":"the body mass","unit":"kg","dec":1,"vdec":0,"values":[70.0,72.0,93.0,70.0,62.0,72.0,66.0,72.0,62.0,66.0,55.0,60.0,78.0,80.0,83.0],"n":15,"mean":70.73333333333333,"sd":9.82319897463337,"min":55.0,"max":93.0},{"id":"fat_thickness","key":"pv:fat_thickness","name":"Fat thickness","noun":"the fat thickness","unit":"mm","dec":1,"vdec":1,"values":[12.0,8.0,10.0,10.33333333,19.0,5.333333333,12.0,7.333333333,4.333333333,6.0,18.0,15.66666667,8.0,9.0,11.0],"n":15,"mean":10.399999999933334,"sd":4.390104312682302,"min":4.333333333,"max":19.0},{"id":"max_force","key":"pv:max_force","name":"Maximal force","noun":"the maximal force","unit":"N","dec":0,"vdec":0,"values":[627.0,679.0,951.5,631.0,373.5,458.0,454.0,655.5,389.0,324.0,397.5,335.0,687.0,773.0,554.5],"n":15,"mean":552.6333333333333,"sd":182.28475238587828,"min":324.0,"max":951.5}],"cats":[{"id":"sex","key":"pc:sex","name":"Sex","values":["M","M","M","M","F","M","M","M","M","M","F","F","M","M","M"],"levels":[{"code":"M","name":"man","plural":"men","count":12},{"code":"F","name":"woman","plural":"women","count":3}]}]},"corr":{"x":"fat_thickness","by":"Activation","family":"8","method":["pearson"],"correction":["holm"],"within":"axis","strength":[[0.8,"very strong"],[0.6,"strong"]]},"refs":{"freedman1983":{"label":["Freedman & Lane","1983"],"html":"Freedman D, Lane D (1983). A nonstochastic interpretation of reported significance levels. <i>Journal of Business &amp; Economic Statistics<\/i>, 1, 292–298. <a href=\"https://doi.org/10.1080/07350015.1983.10509354\" target=\"_blank\" rel=\"noopener noreferrer\">doi:10.1080/07350015.1983.10509354<\/a>"},"trama2021":{"label":["Trama et al.","2021"],"html":"Trama R, Hautier CA, Souron R, Lapole T, Fouré A, Blache Y (2021). Is accelerometry an effective method to assess muscle vibrations in comparison to ultrafast ultrasonography? <i>IEEE Transactions on Biomedical Engineering<\/i>. <a href=\"https://doi.org/10.1109/TBME.2020.3035838\" target=\"_blank\" rel=\"noopener noreferrer\">doi:10.1109/TBME.2020.3035838<\/a>"},"winkler2014":{"label":["Winkler et al.","2014"],"html":"Winkler AM, Ridgway GR, Webster MA, Smith SM, Nichols TE (2014). Permutation inference for the general linear model. <i>NeuroImage<\/i>, 92, 381–397. <a href=\"https://doi.org/10.1016/j.neuroimage.2014.01.060\" target=\"_blank\" rel=\"noopener noreferrer\">doi:10.1016/j.neuroimage.2014.01.060<\/a>"}}};
const NS = 'http://www.w3.org/2000/svg';
const $ = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const S = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; };
const html = (tag, cls, h) => { const e = $(tag, cls); e.innerHTML = h; return e; };
const MINUS = '−', TIMES = '×';
const ALPHA = DATA.alpha;

// ------------------------------------------------------------------ numbers (the texts are written the same way)
const isNum = v => v !== null && v !== undefined && isFinite(v);
function fx(v, d) {
  if (!isNum(v)) return '–';
  let s = v.toFixed(d);
  if (/^-0(\.0+)?$/.test(s)) s = s.slice(1);
  return s.replace('-', MINUS);
}
const sgn = (v, d) => { const s = fx(v, d); return !isNum(v) || s.startsWith(MINUS) || +s === 0 ? s : '+' + s; };
const pfmt = p => !isNum(p) ? '–' : p < 0.001 ? '<0.001' : p.toFixed(3);
const plab = p => p < 0.001 ? 'p < 0.001' : 'p = ' + p.toFixed(3);
const withUnit = (s, u) => !u ? s : u.startsWith('%') ? s + u : s + ' ' + u;

// ------------------------------------------------------------------ factors, levels and their colours
const FAC = {}; DATA.factors.forEach(f => { FAC[f.id] = f; f.lv = {}; f.levels.forEach(L => { f.lv[L.code] = L; }); });
const FIDS = DATA.factors.map(f => f.id);
const cvar = (fid, code) => '--c-' + (fid + '-' + code).replace(/[^A-Za-z0-9_-]/g, '_');
(() => {
  const light = [], dark = [];
  DATA.factors.forEach(f => f.levels.forEach(L => { light.push(cvar(f.id, L.code) + ':' + L.color); dark.push(cvar(f.id, L.code) + ':' + L.color_dark); }));
  const st = document.createElement('style');
  st.textContent = `:root{${light.join(';')}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${dark.join(';')}}}:root[data-theme="dark"]{${dark.join(';')}}`;
  document.head.append(st);
})();
const col = (fid, code) => `var(${cvar(fid, code)})`;
const DESIGN = (DATA.factors.length === 2 ? 'two-way ' : 'one-way ') +
  (DATA.factors.every(f => f.within) ? 'repeated-measures ' : DATA.factors.some(f => f.within) ? 'mixed ' : '') + 'analysis of variance';
const termName = t => t.split(':').map(x => FAC[x].name).join(' ' + TIMES + ' ');
const cellName = (lv, sep) => FIDS.map(f => FAC[f].lv[lv[f]].name).join(sep || ' · ');
const cellShort = lv => FIDS.map(f => FAC[f].lv[lv[f]].short).join(' · ');
const ROWS = DATA.rows;
const rowLabel = (R, multi) => multi ? R.name + (R.splitName ? ' · ' + R.splitName : '') : (R.splitName || R.name);

// ------------------------------------------------------------------ linking: one key per statistic, marked everywhere
// keys of a row: t:<term> (ANOVA), m:... and x:... (comparisons: a main effect, or inside an interaction),
// cell:<code> (a condition), lv:<factor>=<level> (a level over the other factor)
const compOf = (R, k) => (R.comps || []).find(c => c.key === k);
function owner(R, k) { if (!R || !k) return null; const c = compOf(R, k); return c ? 't:' + c.term : null; }
const related = (R, a, b) => a === b || owner(R, a) === b || owner(R, b) === a;
let hov = null, pin = null, curRow = null;
function paint() {
  document.querySelectorAll('.hov, .on, .pinned').forEach(e => e.classList.remove('hov', 'on', 'pinned'));
  const mark = (st, cls) => {
    if (!st) return;
    const R = ROWS[st.row];
    document.querySelectorAll('[data-k]').forEach(e => { if (e.dataset.row === st.row && related(R, st.key, e.dataset.k)) e.classList.add(cls); });
    document.querySelectorAll('[data-ks]').forEach(e => { if (e.dataset.row === st.row && e.dataset.ks.split(' ').includes(st.key)) e.classList.add(cls); });
  };
  mark(pin, 'on');
  if (pin) document.querySelectorAll('[data-k]').forEach(e => { if (e.dataset.row === pin.row && e.dataset.k === pin.key && e === pin.el) e.classList.add('pinned'); });
  if (pin) document.querySelectorAll('[data-ks]').forEach(e => { if (e.dataset.row === pin.row && e.dataset.ks.split(' ')[0] === pin.key) e.classList.add('pinned'); });
  mark(hov, 'hov');
  document.querySelectorAll('#content tr.data').forEach(tr => tr.classList.toggle('cur', tr.dataset.row === curRow));
}
function setHover(row, key) {
  hov = row ? { row, key } : null;
  if (row && !pin && row !== curRow) showRow(row);
  paint();
}
let clickUsed = false;
function toggle(row, key, el) {
  clickUsed = true;
  if (pin && pin.row === row && pin.key === key) { pin = null; paint(); return; }
  pin = { row, key, el };
  if (row !== curRow) showRow(row);
  setCollapsed(false);
  paint();
}
function release() { if (pin) { pin = null; paint(); } }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && pin && !document.getElementById('big').open) release(); });
document.addEventListener('pointerdown', () => { clickUsed = false; }, true);
document.addEventListener('click', e => {
  if (clickUsed || !pin) return;
  if (e.target.closest('button, a, input, select, summary, dialog, .chip, .harrow, .pbar')) return;
  const s = window.getSelection(); if (s && !s.isCollapsed) return;
  release();
});
// text spans, table cells and rows, statistics rows: data-row + data-k
function linkable(e) { const el = e.target.closest('[data-k]'); return el && el.dataset.row ? el : null; }
function wire(root) {
  root.addEventListener('pointerover', e => { const el = linkable(e); if (el) setHover(el.dataset.row, el.dataset.k);
    else { const tr = e.target.closest('tr.data'); if (tr) setHover(tr.dataset.row, null); } });
  root.addEventListener('pointerout', e => { const el = linkable(e); if (el && !el.contains(e.relatedTarget)) setHover(null); });
  root.addEventListener('focusin', e => { const el = linkable(e); if (el) setHover(el.dataset.row, el.dataset.k); });
  root.addEventListener('click', e => { const el = linkable(e); if (el) { toggle(el.dataset.row, el.dataset.k, el); return; }
    const tr = e.target.closest('tr.data'); if (tr) { clickUsed = true; if (!pin) showRow(tr.dataset.row); } });
  root.addEventListener('keydown', e => { const el = linkable(e); if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(el.dataset.row, el.dataset.k, el); } });
}
const linkAttrs = (el, row, key) => { el.dataset.row = row; el.dataset.k = key; el.tabIndex = 0; return el; };

// ------------------------------------------------------------------ the violins
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); return [1, 2, 2.5, 5, 10].find(m => m * p >= raw * (1 - 1e-9)) * p; }
// a group's distribution: Gaussian kernel density, Silverman's bandwidth, drawn over the data +/- half a bandwidth
function kde(v) {
  const n = v.length;
  if (n < 3) return null;
  const s = [...v].sort((x, y) => x - y);
  const mu = s.reduce((x, y) => x + y, 0) / n;
  const sd = Math.sqrt(s.reduce((x, y) => x + (y - mu) ** 2, 0) / (n - 1));
  const q = f => { const i = (n - 1) * f, lo = Math.floor(i); return s[lo] + (s[Math.min(lo + 1, n - 1)] - s[lo]) * (i - lo); };
  const iqr = q(0.75) - q(0.25);
  const h = 0.9 * Math.min(sd, iqr > 0 ? iqr / 1.34 : sd) * Math.pow(n, -0.2);
  if (!(h > 0)) return null;
  const lo = s[0] - 0.5 * h, hi = s[n - 1] + 0.5 * h, K = 64, grid = [];
  let dmax = 0;
  for (let k = 0; k <= K; k++) {
    const y = lo + (hi - lo) * k / K;
    let d = 0; for (const x of s) d += Math.exp(-0.5 * ((y - x) / h) ** 2);
    grid.push([y, d]); dmax = Math.max(dmax, d);
  }
  const at = y => { if (y <= lo || y >= hi) return 0; const t = (y - lo) / (hi - lo) * K, k = Math.floor(t);
    const d0 = grid[k][1], d1 = grid[Math.min(k + 1, K)][1]; return (d0 + (d1 - d0) * (t - k)) / dmax; };
  return { lo, hi, grid, dmax, at };
}
// the parts of a closed outline (X, Y) whose y lies in [a b]: the mean +/- SD stretch of a violin's outline
function band(X, Y, a, b) {
  const runs = []; let cur = null;
  for (let i = 0; i < X.length - 1; i++) {
    const y0 = Y[i], dy = Y[i + 1] - y0;
    let t = null;
    if (dy === 0) { if (y0 >= a && y0 <= b) t = [0, 1]; }
    else { const ta = (a - y0) / dy, tb = (b - y0) / dy; t = [Math.max(0, Math.min(ta, tb)), Math.min(1, Math.max(ta, tb))]; if (t[0] > t[1]) t = null; }
    if (!t) { if (cur) { runs.push(cur); cur = null; } continue; }
    const pt = f => [X[i] + f * (X[i + 1] - X[i]), y0 + f * dy];
    if (!cur || t[0] > 0) { if (cur) runs.push(cur); cur = [pt(t[0])]; }
    cur.push(pt(t[1]));
    if (t[1] < 1) { runs.push(cur); cur = null; }
  }
  if (cur) runs.push(cur);
  return runs;
}
const meanSd = (m, sd, d) => [fx(m, d), isNum(sd) ? '(' + fx(sd, d) + ')' : ''];
const sdv = v => { const n = v.length; if (n < 2) return NaN; const m = v.reduce((a, b) => a + b, 0) / n; return Math.sqrt(v.reduce((a, b) => a + (b - m) ** 2, 0) / (n - 1)); };

// the panels of a row's figure: the main effects, then the interaction read one factor at a time
function panelsOf(R) {
  const P = [];
  const cellVals = lv => R.values[FIDS.map(f => lv[f]).join('|')];
  const comps = (fid, at) => R.comps.filter(c => c.factor === fid && JSON.stringify(c.at) === JSON.stringify(at));
  if (FIDS.length === 1) {
    const f = FAC[FIDS[0]];
    P.push({ row: 0, id: 'm:' + f.id, title: f.name, fid: f.id, term: f.id, within: f.within,
             groups: f.levels.map(L => ({ fid: f.id, code: L.code, label: L.short, key: 'cell:' + L.code, name: L.name, vals: cellVals({ [f.id]: L.code }) })),
             comps: comps(f.id, {}) });
    return P;
  }
  FIDS.forEach(fid => {
    const f = FAC[fid];
    P.push({ row: 0, id: 'm:' + fid, title: f.name, fid, term: fid, within: f.within,
             groups: f.levels.map(L => { const lv = R.levels.find(x => x.factor === fid && x.level === L.code);
               return { fid, code: L.code, label: L.short, key: lv.key, name: L.name + ' (all ' + FAC[FIDS.find(x => x !== fid)].plural + ')', vals: lv.values }; }),
             comps: comps(fid, {}) });
  });
  const inter = FIDS.join(':');
  FIDS.forEach((fid, r) => {
    const f = FAC[fid], g = FAC[FIDS.find(x => x !== fid)];
    g.levels.forEach(M => {
      P.push({ row: r + 1, id: 'x:' + fid + '@' + g.id + '=' + M.code, title: M.name, fid, term: inter, within: f.within, reading: [fid, g.id],
               groups: f.levels.map(L => { const lv = { [fid]: L.code, [g.id]: M.code };
                 return { fid, code: L.code, label: L.short, key: 'cell:' + FIDS.map(x => lv[x]).join('|'), name: cellName(lv), vals: cellVals(lv) }; }),
               comps: comps(fid, { [g.id]: M.code }) });
    });
  });
  return P;
}

// draw a row's figure at the width of its host (redrawn, not scaled, so its text stays ~12 px)
function drawFigure(host, R, opts) {
  host.replaceChildren();
  const W = Math.max(300, Math.round(opts.width));
  const P = panelsOf(R);
  const aovOf = t => R.aov.find(a => a.term === t);
  const inter = FIDS.length === 2 ? aovOf(FIDS.join(':')) : null;
  const NR = Math.max(...P.map(p => p.row)) + 1;
  P.forEach(pn => pn.groups.forEach(g => {
    const v = g.vals.filter(isNum);
    g.n = v.length; g.mean = v.length ? v.reduce((a, b) => a + b, 0) / v.length : NaN; g.sd = sdv(v); g.kde = kde(v);
  }));
  const ext = g => g.vals.filter(isNum).concat(isNum(g.mean) ? [g.mean] : [], g.kde ? [g.kde.lo, g.kde.hi] : []);
  const all = P.flatMap(pn => pn.groups.flatMap(ext));
  let lo = Math.min(...all), hi = Math.max(...all);
  if (!(hi > lo)) hi = lo + 1;
  const st = niceStep((hi - lo) / 6);                      // the axis follows the data (it does not start at 0)
  const t0 = Math.floor(lo / st + 1e-9) * st, t1 = Math.ceil(hi / st - 1e-9) * st;
  const ticks = []; for (let v = t0; v <= t1 + st * 1e-6; v += st) ticks.push(+v.toFixed(10));
  const tickDec = (String(+st.toPrecision(6)).split('.')[1] || '').length;
  // a caption line per row; two lines when the reading and the interaction's p would not fit side by side
  const capLong = NR > 1 ? Math.max(...FIDS.map(fid => {
    const g = FAC[FIDS.find(x => x !== fid)];
    return (FAC[fid].plural + ' within each ' + g.noun).length + termName(FIDS.join(':')).length + 26; })) : 0;
  const capH0 = NR > 1 ? (capLong * 6.4 > W - 24 ? 34 : 20) : 0, titleH = 20, labH = 22, gapR = 16, mL = 50, mR = 6;
  const plotH = Math.round(Math.max(170, Math.min(260, W * 0.42)));
  // the lines of panels: one row of the design each, or, in a narrow figure, one panel per line (the row's
  // caption over its first panel), so that the levels' names never run into each other
  const narrow = W < 460;
  const lines = [];
  for (let r = 0; r < NR; r++) {
    const P0 = P.filter(p => p.row === r);
    if (narrow) P0.forEach((pn, k) => lines.push({ r, cap: k === 0, panels: [pn] }));
    else lines.push({ r, cap: true, panels: P0 });
  }
  const lineH = L => (L.cap ? capH0 : 0) + titleH + plotH + labH;
  const H = lines.reduce((a, L) => a + lineH(L), 0) + (lines.length - 1) * gapR + 4;
  const LAB = 31, BR = 26;                                   // the mean's two lines above it; a bracket and its p
  // headroom so that a line's brackets fit under its titles: grown until they do (one value scale per line)
  function padOf(P0) {
    let pad = BR + 4;
    for (let it = 0; it < 8; it++) {
      const Yr = v => plotH - (v - t0) / (t1 - t0) * (plotH - pad);
      let over = 0;
      P0.forEach(pn => {
        const nb = brackets(pn).length;
        if (!nb) return;
        const top = Math.min(...pn.groups.filter(g => isNum(g.mean)).map(g => Math.min(Yr(Math.max(...ext(g))), Yr(g.mean) - LAB)));
        over = Math.max(over, nb * BR + 2 - top);
      });
      if (over <= 0.5) break;
      pad += over;
    }
    return pad;
  }
  function brackets(pn) {
    if (pn.groups.length === 2) return pn.comps.slice(0, 1);
    return pn.comps.filter(c => c.sig);
  }
  const svg = S('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': 'Violins of ' + R.name + (R.splitName ? ', ' + R.splitName : '') });
  const tt = $('div', 'tt');
  const boxes = [], byP = {};
  const dec = R.dec;
  let y0 = 0;
  for (const line of lines) {
    const P0 = line.panels, r = line.r, capH = line.cap ? capH0 : 0, ly = y0;
    const yTop = ly + capH + titleH, yBot = yTop + plotH, pad = padOf(P0);
    y0 += lineH(line) + gapR;
    const Y = v => yBot - (v - t0) / (t1 - t0) * (plotH - pad);
    // the row's caption: what it reads, and its ANOVA term

        figTip(tt, svg, W, [['b', DATA.people[i]], ['', ' · ' + L.name.toLowerCase() + ': ' + withUnit(sgn(y, R.yDec), R.yUnit) +
          ' at ' + withUnit(fx(x, X.dec), X.unit)]].concat(personLines(i)), px, py); });
      hit.addEventListener('pointerleave', () => { person(i, false); tt.style.display = 'none'; });
    });
  });
  host._byP = byP; host._top = S('g', { 'pointer-events': 'none' }, svg);
  wireBoxes(svg, W, R.id, boxes, tt);
  host.append(svg, tt);
}
function corrStats(R) {
  const box = $('div', 'stats'), C = DATA.corr || {}, X = PV[R.x];
  box.append($('h4', null, 'Correlations'));
  const unit = R.yUnit + ' per ' + (X && X.unit ? X.unit : 'unit');
  box.append(statTable(['Correlation', 'n', 'r', 'Slope (' + unit + ')', 'p', 'p uncorrected', 'Strength'], R.entries.map(e => ({
    key: e.key, cells: [levelOf(R.by, e.level).name, String(e.n), { t: fx(e.r, 2), b: e.sig }, sgn(e.slope, 2), { t: pfmt(e.p), b: e.sig },
                        pfmt(e.pRaw), e.sig ? (e.strength || '–') : '–'] })), R));
  const words = (C.strength || []).map(([th, w]) => w + ': |r| ≥ ' + th).join('; ');
  box.append($('p', 'snote', 'Pearson’s r; slope: least squares' + (C.family ? '; p corrected (' + (C.correction || []).join(', ').replace('holm', 'Holm–Bonferroni') +
    ') over the ' + C.family + ' tests' + (C.within ? ' of each ' + C.within : '') + ', p uncorrected before it' : '') + '. Bold: p ≤ ' + ALPHA + '.' + (words ? ' Strength (significant only): ' + words + '.' : '')));
  return box;
}
function corrPeopleTable(tab) {
  const rows = tab.rows.map(r => ROWS[r]), X = PV[rows[0].x];
  const t = $('table', 't pp'), th = $('thead'), h1 = $('tr'), h2 = $('tr');
  h1.append($('th'), $('th')); h2.append($('th', null, 'Participant'), $('th', null, X.name + (X.unit ? ' (' + X.unit + ')' : '')));
  rows.forEach((R, gi) => { const c = $('th', 'g0' + (gi % 2 ? ' sh' : ''), R.name + (R.splitName ? ' · ' + R.splitName : '') + ' (' + R.yUnit + ')');
    c.colSpan = R.entries.length; h1.append(c);
    R.entries.forEach((e, k) => h2.append($('th', (k ? '' : 'g0') + (gi % 2 ? ' sh' : ''), levelOf(R.by, e.level).name))); });
  th.append(h1, h2); t.append(th);
  const tb = $('tbody');
  DATA.people.forEach((p, i) => {
    const tr = $('tr'); tr.dataset.p = i; tr.append($('td', null, p), $('td', null, fx(X.values[i], X.dec)));
    rows.forEach((R, gi) => R.entries.forEach((e, k) => tr.append($('td', (k ? '' : 'g0') + (gi % 2 ? ' sh' : ''), sgn(e.y[i], R.yDec + 1)))));
    tr.addEventListener('pointerenter', () => person(i, true));
    tr.addEventListener('pointerleave', () => person(i, false));
    tb.append(tr);
  });
  t.append(tb);
  return t;
}
function corrCsv(tab) {
  const rows = tab.rows.map(r => ROWS[r]), X = PV[rows[0].x];
  const q = s => /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  const head = ['participant', q(X.name + (X.unit ? ' (' + X.unit + ')' : ''))];
  rows.forEach(R => R.entries.forEach(e => head.push(q(R.name + (R.splitName ? ' ' + R.splitName : '') + ' ' + levelOf(R.by, e.level).name + ' (' + R.yUnit + ')'))));
  const lines = [head.join(',')];
  DATA.people.forEach((p, i) => { const r = [p, isNum(X.values[i]) ? String(X.values[i]) : ''];
    rows.forEach(R => R.entries.forEach(e => r.push(isNum(e.y[i]) ? String(e.y[i]) : ''))); lines.push(r.join(',')); });
  return lines.join('\r\n') + '\r\n';
}

// ------------------------------------------------------------------ citations: the reference in a popover
// Hover a citation: after 150 ms its reference opens under it (over it when there is no room), with its link;
// leaving closes it after 250 ms, so the pointer can reach the link. A click keeps it open; Esc, the x, a second
// click or a click elsewhere closes it. A citation and its entry in the references mark each other.
const REFS = DATA.refs || {};
const pop = $('div', 'pop'); pop.hidden = true; pop.setAttribute('role', 'dialog'); document.body.append(pop);
let popFor = null, popPinned = false, popT = null;
const markRef = (key, on) => document.querySelectorAll(`.cite[data-cite="${key}"], .refentry[data-ref="${key}"]`)
  .forEach(e => e.classList.toggle('chov', on));
function openPop(el, pinned) {
  const key = el.dataset.cite, ref = REFS[key];
  if (!ref) return;
  clearTimeout(popT);
  if (popFor && popFor !== el) { markRef(popFor.dataset.cite, false); popFor.classList.remove('cpin'); }
  popFor = el; popPinned = !!pinned;
  markRef(key, true); el.classList.toggle('cpin', popPinned);
  pop.classList.toggle('pinned', popPinned);
  pop.innerHTML = ref.html;
  pop.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
  const x = $('button', 'x', '×'); x.type = 'button'; x.setAttribute('aria-label', 'Close'); x.addEventListener('click', closePop);
  pop.prepend(x);
  pop.hidden = false;
  const docW = document.documentElement.clientWidth, pw = Math.min(460, docW - 24);
  pop.style.width = pw + 'px';
  // under the line of the citation the pointer is on (a citation may wrap over two lines)
  const rects = [...el.getClientRects()], r = rects[0] || el.getBoundingClientRect();
  const left = Math.max(12, Math.min(r.left + r.width / 2 - pw / 2, docW - pw - 12));
  const below = r.bottom + 6, h = pop.offsetHeight;
  const top = below + h + 8 > window.innerHeight && r.top - h - 6 > 0 ? r.top - h - 6 : below;
  pop.style.left = (left + window.scrollX) + 'px';
  pop.style.top = (top + window.scrollY) + 'px';
}
function closePop() {
  clearTimeout(popT);
  if (!popFor) return;
  markRef(popFor.dataset.cite, false); popFor.classList.remove('cpin');
  popFor = null; popPinned = false; pop.hidden = true;
}
document.addEventListener('pointerover', e => {
  const c = e.target.closest && e.target.closest('.cite');
  if (c) { clearTimeout(popT); if (popFor !== c && !popPinned) popT = setTimeout(() => openPop(c, false), 150); return; }
  if (e.target.closest && e.target.closest('.pop')) { clearTimeout(popT); return; }
  const r = e.target.closest && e.target.closest('.refentry');
  document.querySelectorAll('.refentry.chov, .cite.chov').forEach(x => { if (!popFor || x.dataset.cite !== popFor.dataset.cite && x.dataset.ref !== popFor.dataset.cite) x.classList.remove('chov'); });
  if (r) markRef(r.dataset.ref, true);
  if (popFor && !popPinned) { clearTimeout(popT); popT = setTimeout(closePop, 250); }
});
document.addEventListener('click', e => {
  const c = e.target.closest('.cite');
  if (c) { clickUsed = true; if (popFor === c && popPinned) closePop(); else openPop(c, true); return; }
  if (popFor && !e.target.closest('.pop')) closePop();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && popFor) closePop();
  const c = e.target.closest && e.target.closest('.cite');
  if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openPop(c, true); }
});
document.addEventListener('focusin', e => { const c = e.target.closest && e.target.closest('.cite'); if (c && !popPinned) openPop(c, false); });
document.addEventListener('focusout', e => { const c = e.target.closest && e.target.closest('.cite'); if (c && !popPinned && popFor === c) closePop(); });
window.addEventListener('resize', () => { if (popFor && !popPinned) closePop(); });

// ------------------------------------------------------------------ tabs
const content = document.getElementById('content'), main = document.getElementById('main');
wire(content);
let nav = { top: 'methods', g: 0, t: 0 };            // the document opens on its methods
try { const v = JSON.parse(localStorage.getItem('srd-nav') || 'null'); if (v && (v.top === 'methods' || v.top === 'results') && DATA.groups[v.g] && DATA.groups[v.g].tabs[v.t]) nav = v; } catch (e) {}
function save() { try { localStorage.setItem('srd-nav', JSON.stringify(nav)); } catch (e) {} }
function chips(host, items, on, pick) {
  host.replaceChildren();
  items.forEach((label, i) => { const b = $('button', 'chip', label); b.type = 'button'; b.setAttribute('aria-pressed', String(i === on));
    b.addEventListener('click', () => pick(i)); host.append(b, document.createTextNode(' ')); });
}
function render() {
  pin = null; hov = null; curRow = null; closePop();
  const isM = nav.top === 'methods';
  document.getElementById('tabMethods').setAttribute('aria-selected', String(isM));
  document.getElementById('tabResults').setAttribute('aria-selected', String(!isM));
  main.classList.toggle('methods', isM);
  document.getElementById('groupbar').hidden = isM || DATA.groups.length < 2;
  const G = DATA.groups[nav.g];
  document.getElementById('tabbar').hidden = isM || G.tabs.length < 2;
  content.replaceChildren();
  if (isM) {
    const art = $('div', 'box prose');
    DATA.methods.forEach(s => {
      if (s.h) art.append($('h2', null, s.h));
      s.p.forEach(h => art.append(html('p', null, h)));
      if (DATA.people_info && s.h === DATA.people_info.section) art.append(participantsBlock());
    });
    art.querySelectorAll('.ref').forEach(sp => { sp.tabIndex = 0; sp.setAttribute('role', 'button'); });
    content.append(art);
    drawTraitsNow();
    save(); return;
  }
  chips(document.getElementById('groups'), DATA.groups.map(g => g.label), nav.g, i => { nav.g = i; nav.t = 0; render(); });
  chips(document.getElementById('tabs'), G.tabs.map(t => t.label), nav.t, i => { nav.t = i; render(); });
  const tab = G.tabs[nav.t];
  const rb = $('div', 'box results');
  rb.append($('h2', null, 'Results'));
  tab.text.forEach(h => rb.append(html('p', null, h)));
  rb.querySelectorAll('.ref').forEach(sp => { sp.tabIndex = 0; sp.setAttribute('role', 'button'); });
  content.append(rb);
  const tb = $('div', 'box');
  tb.append($('h2', null, tab.label));
  const corr = tab.kind === 'corr';
  const sc = $('div', 'tablebox'); sc.append(corr ? corrTable(tab) : mainTable(tab)); tb.append(hscroll(sc));
  const R0 = ROWS[tab.rows[0]];
  tb.append($('p', 'note', corr ? corrNote(R0) : `Mean (SD) of the ${R0.n} participants. p: ${DESIGN}` +
    (DATA.nPerm ? `, exact p-values from all ${DATA.nPerm.toLocaleString('en')} sign-flip permutations` : '') +
    `; bold: p ≤ ${ALPHA}. Hover a row, a value or a p-value to see its figure and statistics; click to keep them.`));
  content.append(tb);
  const det = $('details', 'box');
  det.append($('summary', null, 'Values per participant'));
  const ps = $('div', 'tablebox'); ps.append(corr ? corrPeopleTable(tab) : peopleTable(tab)); det.append(hscroll(ps));
  const dl = $('button', 'btn', 'Download these values (CSV)'); dl.type = 'button'; dl.style.marginTop = '8px';
  dl.addEventListener('click', () => download(tab.label.replace(/[\\/:*?"<>|]/g, '') + '.csv', corr ? corrCsv(tab) : csvOf(tab)));
  det.append(dl);
  content.append(det);
  showRow(tab.rows[0]);
  paint();
  save();
}
document.getElementById('tabMethods').addEventListener('click', () => { nav.top = 'methods'; render(); });
document.getElementById('tabResults').addEventListener('click', () => { nav.top = 'results'; render(); });
document.getElementById('brand').textContent = DATA.title;
document.getElementById('sub').textContent = DATA.subtitle;
document.getElementById('foot').innerHTML = DATA.footer;
render();
</script>
